<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOLOv3 bench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@380;520;640&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <p class="eyebrow">Darknet-53 · three scales</p>
        <h1>YOLOv3 bench</h1>
      </div>
    </div>
    <p id="status" class="status">Loading the detector…</p>
  </header>

  <div id="banner" class="banner" hidden>
    <p id="banner-text">Train this reimplementation, or load a Darknet weight file to compare.</p>
    <button id="download" type="button">Load COCO Darknet file</button>
  </div>

  <main>
    <aside class="film">
      <div class="film-head">
        <h2>Plates</h2>
        <label class="upload">
          Upload
          <input id="file" type="file" accept="image/*">
        </label>
      </div>
      <div id="filmstrip" class="strip"></div>
    </aside>

    <section class="stage">
      <div id="frame" class="frame">
        <p id="empty" class="empty">Choose a plate to run the detector.</p>
        <img id="photo" alt="" hidden>
        <svg id="overlay" hidden></svg>
        <p id="working" class="working" hidden>Reading the plate…</p>
      </div>
      <p id="caption" class="caption"></p>
    </section>

    <aside class="inspector">
      <h2>Exposure</h2>
      <label class="slider">
        <span>Weights</span>
        <select id="weights"></select>
      </label>
      <label class="slider">
        <span>Confidence <b id="conf-value">0.25</b></span>
        <input id="conf" type="range" min="0.05" max="0.9" step="0.01" value="0.25">
      </label>
      <label class="slider">
        <span>NMS IoU <b id="iou-value">0.45</b></span>
        <input id="iou" type="range" min="0.1" max="0.9" step="0.01" value="0.45">
      </label>
      <label class="slider">
        <span>Network size</span>
        <select id="imgsz">
          <option value="320">320</option>
          <option value="416" selected>416</option>
          <option value="512">512</option>
          <option value="608">608</option>
        </select>
      </label>
      <label class="check">
        <input id="show-labels" type="checkbox" checked>
        Show synthetic labels
      </label>

      <div class="scales" id="scales">
        <button type="button" data-scale="all" class="on">All</button>
        <button type="button" data-scale="large">Large</button>
        <button type="button" data-scale="medium">Medium</button>
        <button type="button" data-scale="small">Small</button>
      </div>

      <div class="summary">
        <p id="count">No detections yet</p>
        <p id="timing"></p>
      </div>
      <ol id="hits" class="hits"></ol>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
